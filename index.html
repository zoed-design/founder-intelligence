<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder Intelligence</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <div class="name">Founder Intelligence</div>
        <div class="tag">Ridgeline Homes <span class="fict">(fictional)</span> · construction edition</div>
      </div>
    </div>
    <nav class="roles" aria-label="Switch role">
      <button data-role="founder" class="role"><span class="av av-founder" aria-hidden="true">F</span>Founder</button>
      <button data-role="site" class="role"><span class="av av-site" aria-hidden="true">S</span>Site crew</button>
      <button data-role="client" class="role"><span class="av av-client" aria-hidden="true">C</span>Homeowner</button>
      <button data-role="office" class="role"><span class="av av-office" aria-hidden="true">O</span>Office</button>
      <button data-role="public" class="role"><span class="av av-public" aria-hidden="true">P</span>Public</button>
    </nav>
    <div class="bar-actions">
      <button id="demoBtn" class="btn btn-accent">Play demo morning</button>
      <button id="resetBtn" class="btn btn-quiet">Reset</button>
    </div>
  </div>
  <div class="dummy-strip">Demo app with labelled dummy data. The agents' reasoning is rule-based and simulated; access tiers, review and audit are real. <a href="https://github.com/Business-Analyst-Services/founder-intelligence/blob/main/docs/agents.md">How the agents work</a></div>
</header>

<div class="layout">
  <main id="view" class="view" tabindex="-1"></main>
  <aside class="mapcol" aria-labelledby="mapTitle">
    <div class="mascot" id="mascot">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="mascot-bar">
        <div><b>Digger</b> <span>the foreman</span></div>
        <div class="mascot-btns">
          <button id="danceBtn" type="button">Dance</button>
          <button id="soundBtn" type="button" aria-pressed="false">Voice off</button>
        </div>
      </div>
    </div>
    <div class="mapcard">
      <div class="map-head">
        <h2 id="mapTitle">Agents at work</h2>
        <span class="live-dot" aria-hidden="true"></span>
      </div>
      <svg id="agentMap" class="map" role="img" aria-label="Agent map: messages flow from capture to router, curator and specialist agents, then to the founder gate or delivery. The step list below describes each move."></svg>
      <div class="legend"><span class="lg lg-agent">Agent</span><span class="lg lg-human">Founder</span><span class="lg lg-store">Knowledge</span></div>
      <h3 class="trace-title">Step by step</h3>
      <ol id="trace" class="trace"></ol>
    </div>
  </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/three.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
