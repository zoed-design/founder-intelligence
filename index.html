<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder Intelligence</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <div class="name">Founder Intelligence</div>
        <div class="tag">The founder’s know-how, on tap for the whole crew</div>
      </div>
    </div>
    <nav class="roles" aria-label="See the app as">
      <span class="roles-label">See it as</span>
      <button data-role="founder" class="role"><span class="av av-founder" aria-hidden="true">F</span>Founder</button>
      <button data-role="site" class="role"><span class="av av-site" aria-hidden="true">S</span>Site crew</button>
      <button data-role="client" class="role"><span class="av av-client" aria-hidden="true">H</span>Homeowner</button>
      <button data-role="office" class="role"><span class="av av-office" aria-hidden="true">O</span>Office</button>
      <button data-role="public" class="role"><span class="av av-public" aria-hidden="true">P</span>Public</button>
    </nav>
    <div class="bar-actions">
      <button id="demoBtn" class="btn btn-accent">Play the 7 am rush</button>
      <button id="resetBtn" class="btn btn-quiet">Start over</button>
    </div>
  </div>
  <div class="dummy-strip">Demo with a made-up building company. <a href="https://github.com/Business-Analyst-Services/founder-intelligence/blob/main/docs/agents.md">How it works</a></div>
</header>

<div class="layout">
  <main id="view" class="view" tabindex="-1"></main>
  <aside class="mapcol" aria-label="The crew at work">
    <div class="mascot" id="mascot">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="mascot-bar">
        <div><b>Digger</b> <span>the foreman</span></div>
        <div class="mascot-btns">
          <button id="danceBtn" type="button">Dance</button>
          <button id="soundBtn" type="button" aria-pressed="false">Voice off</button>
        </div>
      </div>
    </div>
    <div class="mapcard">
      <div class="map-head">
        <h2>The crew at work</h2>
        <span class="live-dot" aria-hidden="true"></span>
      </div>
      <p class="map-sub">Every message goes down the line. Most get answered; the rest come to you.</p>
      <svg id="agentMap" class="map" role="img" aria-label="Messages pass from Lyra, who listens, to Digger, who checks who’s asking, to Bower, who finds the answer, then to Roo, Tally or Kooka. Answers go out, or wait for the founder."></svg>
      <details class="steps">
        <summary>Show each step</summary>
        <ol id="trace" class="trace"></ol>
      </details>
    </div>
  </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/three.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
