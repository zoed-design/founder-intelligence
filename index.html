<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction and Contractor Intelligence</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="demo.css?v=single-project-2">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <div class="name">Construction and Contractor Intelligence</div>
        <div class="tag">Empower your business to scale</div>
      </div>
    </div>
    <nav class="roles" aria-label="App views">
      <button data-page="workspace" class="role" aria-current="page">Digger · Site Manager</button>
      <button data-page="admin" class="role">Roo · Employee Coach</button>
      <button data-page="client" class="role">Tally · Client</button>
      <button data-page="social" class="role">Kooka · Brand Stories</button>
    </nav>
    <div class="bar-actions">
      <button id="resetBtn" class="btn btn-quiet">New session</button>
    </div>
  </div>
</header>

<div class="layout">
  <main id="view" class="view" tabindex="-1"></main>
  <aside class="mapcol" aria-label="The crew at work">
    <div class="mascot" id="mascot">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="mascot-bar">
        <div><b>Digger</b> <span>Site Manager</span></div>
        <div class="mascot-btns">
          <button id="danceBtn" type="button">Dance</button>
          <button id="soundBtn" type="button" aria-pressed="false">Voice off</button>
        </div>
      </div>
    </div>
    <div class="mapcard">
      <div class="map-head">
        <h2>The crew at work</h2>
        <span class="live-dot" aria-hidden="true"></span>
      </div>
      <p class="map-sub">Questions, references and next steps.</p>
      <svg id="agentMap" class="map" role="img" aria-label="New messages reach Digger, the Site Manager, and Lyra. Lyra collects and organizes the Wiki. Bower finds references and coordinates next steps. Roo is the Employee Coach: Roo uses that context to guide employees, answers their questions and flags issues for Digger to review. Tally supports client updates. Kooka develops Brand Stories."></svg>
      <p class="map-key">↔ Questions, tasks &amp; reminder drafts</p>
      <details class="steps">
        <summary>Show each step</summary>
        <ol id="trace" class="trace"></ol>
      </details>
    </div>
  </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/three.min.js"></script>
<script type="module" src="demo.js?v=single-project-2"></script>
</body>
</html>
